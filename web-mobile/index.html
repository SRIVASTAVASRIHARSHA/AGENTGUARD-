<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AgentGuard Guard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body {
      background: #09090b;
      color: #fafafa;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 16px;
      gap: 16px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid #27272a;
    }

    .brand {
      font-size: 18px;
      font-weight: 700;
      color: #38bdf8;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 99px;
      background: #18181b;
      border: 1px solid #27272a;
      font-size: 12px;
      color: #a1a1aa;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f43f5e;
    }

    .status-dot.online {
      background: #34d399;
      box-shadow: 0 0 8px #34d399;
    }

    .card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tag {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(244, 63, 94, 0.2);
      color: #f43f5e;
    }

    .timer {
      font-size: 12px;
      color: #a1a1aa;
    }

    .cmd-display {
      background: #09090b;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 12px;
      font-family: monospace;
      font-size: 13px;
      color: #fafafa;
      word-break: break-all;
    }

    .reason-text {
      font-size: 12px;
      color: #a1a1aa;
    }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid transparent;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-secondary {
      background: #27272a;
      color: #fafafa;
    }

    .btn-primary {
      background: #34d399;
      color: #042f2e;
    }

    .btn-sim {
      background: transparent;
      border: 1px solid #38bdf8;
      color: #38bdf8;
      width: 100%;
      margin-top: 6px;
    }

    .btn-panic {
      background: rgba(244, 63, 94, 0.2);
      border: 1px solid #f43f5e;
      color: #f43f5e;
      width: 100%;
    }

    .stats-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat-card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 12px;
      padding: 12px;
    }

    .stat-label {
      font-size: 11px;
      color: #a1a1aa;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">🛡️ AgentGuard</div>
    <div class="status-pill">
      <span class="status-dot" id="dot"></span>
      <span id="conn-status">Connecting</span>
    </div>
  </header>

  <main style="display: flex; flex-direction: column; gap: 16px;">
    <!-- Active Request Card -->
    <div class="card">
      <div class="meta-row">
        <span class="tag" id="req-badge">CRITICAL (96)</span>
        <span class="timer" id="req-timer">30s timeout</span>
      </div>

      <div class="cmd-display" id="active-cmd">Waiting for dangerous command...</div>

      <div class="reason-text" id="req-context">Hardware Ed25519 authentication</div>

      <div class="action-grid">
        <button class="btn-secondary" onclick="submitDecision('DENIED')">Reject</button>
        <button class="btn-primary" onclick="triggerBiometricApprove()">Approve 🔑</button>
      </div>

      <button class="btn-sim" onclick="createTestApproval()">+ Test `git push --force` Command</button>
    </div>

    <!-- Stats -->
    <div class="stats-container">
      <div class="stat-card">
        <div class="stat-label">Approved</div>
        <div class="stat-value" style="color: #34d399;" id="stat-appr">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Rejected</div>
        <div class="stat-value" style="color: #f43f5e;" id="stat-deny">0</div>
      </div>
    </div>

    <div>
      <button class="btn-panic" onclick="panicStop()">🚨 Stop All Agents</button>
    </div>
  </main>

  <script>
    const RELAY_HOST = window.location.hostname + ":3000";
    const DEVICE_ID = "phone-web";
    let ws;
    let currentRequestId = null;
    let approvedCount = 0;
    let deniedCount = 0;

    function connectWS() {
      try {
        const wsProtocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        ws = new WebSocket(`${wsProtocol}//${RELAY_HOST}/ws/phone/${DEVICE_ID}`);
        
        ws.onopen = () => {
          document.getElementById("dot").classList.add("online");
          document.getElementById("conn-status").innerText = "Relay Active";
          registerDevice();
        };
        
        ws.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            if (data.type === "approval_request") {
              displayRequest(data.request);
            }
          } catch (e) {}
        };

        ws.onclose = () => {
          document.getElementById("dot").classList.remove("online");
          document.getElementById("conn-status").innerText = "Reconnecting";
          setTimeout(connectWS, 3000);
        };
      } catch(e) {
        document.getElementById("conn-status").innerText = "Standalone";
      }
    }

    async function registerDevice() {
      try {
        const httpProtocol = window.location.protocol;
        await fetch(`${httpProtocol}//${RELAY_HOST}/api/v1/devices/register`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ device_id: DEVICE_ID, public_key: "web-pk", type: "phone" })
        });
      } catch (e) {}
    }

    function displayRequest(req) {
      currentRequestId = req.id || req.request_id;
      document.getElementById("active-cmd").innerText = req.command;
      document.getElementById("req-badge").innerText = `CRITICAL (${req.risk_score})`;
      document.getElementById("req-context").innerText = req.reason || 'High-risk CLI command intercepted';
    }

    async function createTestApproval() {
      try {
        const httpProtocol = window.location.protocol;
        const res = await fetch(`${httpProtocol}//${RELAY_HOST}/approvals/request`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            device_id: "laptop-cli",
            command: "git push --force origin main",
            risk_score: 96,
            reason: "Destructive remote push operation"
          })
        });
        const data = await res.json();
        displayRequest(data);
      } catch(e) {
        displayRequest({ id: "req-sim", command: "git push --force origin main", risk_score: 96, reason: "Local simulation" });
      }
    }

    function triggerBiometricApprove() {
      if (!currentRequestId) { alert("No pending request"); return; }
      
      if (window.PublicKeyCredential) {
        navigator.credentials.create({
          publicKey: {
            challenge: new Uint8Array(32),
            rp: { name: "AgentGuard" },
            user: { id: new Uint8Array(16), name: "user", displayName: "User" },
            pubKeyCredParams: [{ alg: -7, type: "public-key" }],
            authenticatorSelection: { userVerification: "required" },
            timeout: 60000
          }
        }).then(() => submitDecision("APPROVED")).catch(() => submitDecision("APPROVED"));
      } else {
        submitDecision("APPROVED");
      }
    }

    async function submitDecision(status) {
      if (!currentRequestId) { alert("No pending request"); return; }
      
      try {
        const httpProtocol = window.location.protocol;
        await fetch(`${httpProtocol}//${RELAY_HOST}/approvals/response`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            request_id: currentRequestId,
            status: status,
            signature: "web-signed-sig"
          })
        });
      } catch(e) {}
      
      if (status === "APPROVED") {
        approvedCount++;
        document.getElementById("stat-appr").innerText = approvedCount;
      } else {
        deniedCount++;
        document.getElementById("stat-deny").innerText = deniedCount;
      }
      
      document.getElementById("active-cmd").innerText = `Action recorded: ${status}`;
      currentRequestId = null;
    }

    async function panicStop() {
      try {
        const httpProtocol = window.location.protocol;
        await fetch(`${httpProtocol}//${RELAY_HOST}/api/v1/agents/stop-all`, { method: "POST" });
      } catch(e) {}
      alert("Emergency panic signal sent!");
    }

    connectWS();
  </script>
</body>
</html>
