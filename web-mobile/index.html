<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#09090b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AgentGuard">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body {
      background: #09090b;
      color: #fafafa;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 16px;
      gap: 16px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid #27272a;
    }

    .brand {
      font-size: 18px;
      font-weight: 700;
      color: #38bdf8;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 99px;
      background: #18181b;
      border: 1px solid #27272a;
      font-size: 12px;
      color: #a1a1aa;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f43f5e;
    }

    .status-dot.online {
      background: #34d399;
      box-shadow: 0 0 8px #34d399;
    }

    .card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-title {
      font-size: 13px;
      font-weight: 700;
      color: #a1a1aa;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tag {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(244, 63, 94, 0.2);
      color: #f43f5e;
    }

    .timer {
      font-size: 12px;
      color: #a1a1aa;
    }

    .cmd-display {
      background: #09090b;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 12px;
      font-family: monospace;
      font-size: 13px;
      color: #fafafa;
      word-break: break-all;
    }

    .reason-text {
      font-size: 12px;
      color: #a1a1aa;
    }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid transparent;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-secondary {
      background: #27272a;
      color: #fafafa;
    }

    .btn-primary {
      background: #34d399;
      color: #042f2e;
    }

    .btn-sim {
      background: transparent;
      border: 1px solid #38bdf8;
      color: #38bdf8;
      width: 100%;
      margin-top: 6px;
    }

    .btn-panic {
      background: rgba(244, 63, 94, 0.2);
      border: 1px solid #f43f5e;
      color: #f43f5e;
      width: 100%;
    }

    .agent-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      background: #09090b;
      border: 1px solid #27272a;
      border-radius: 8px;
      font-size: 12px;
    }

    .agent-name {
      font-weight: 600;
      color: #fafafa;
    }

    .agent-cmd {
      font-family: monospace;
      color: #a1a1aa;
      font-size: 11px;
    }

    .agent-status {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(52, 211, 153, 0.15);
      color: #34d399;
    }

    .agent-status.intercepted {
      background: rgba(244, 63, 94, 0.15);
      color: #f43f5e;
    }

    .stats-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat-card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 12px;
      padding: 12px;
    }

    .stat-label {
      font-size: 11px;
      color: #a1a1aa;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">🛡️ AgentGuard</div>
    <div class="status-pill">
      <span class="status-dot" id="dot"></span>
      <span id="conn-status">Checking</span>
    </div>
  </header>

  <main style="display: flex; flex-direction: column; gap: 16px;">
    <!-- Active Request Card -->
    <div class="card">
      <div class="meta-row">
        <span class="tag" id="req-badge">CRITICAL (96)</span>
        <span class="timer" id="req-timer">30s timeout</span>
      </div>

      <div class="cmd-display" id="active-cmd">Awaiting high-risk command stream...</div>

      <div class="reason-text" id="req-context">Hardware Ed25519 authentication</div>

      <div class="action-grid">
        <button class="btn-secondary" onclick="submitDecision('DENIED')">Reject</button>
        <button class="btn-primary" onclick="triggerBiometricApprove()">Approve 🔑</button>
      </div>

      <button class="btn-sim" onclick="createTestApproval()">+ Test `git push --force` Command</button>
    </div>

    <!-- 🤖 Live Running Agents Monitor Viewpoint -->
    <div class="card">
      <div class="card-title">🤖 Active Agents Monitor Viewpoint</div>
      <div id="agents-list" style="display: flex; flex-direction: column; gap: 8px;">
        <div class="agent-row">
          <div>
            <div class="agent-name">Gemini-Code-Agent</div>
            <div class="agent-cmd">git status</div>
          </div>
          <span class="agent-status">IDLE</span>
        </div>
        <div class="agent-row">
          <div>
            <div class="agent-name">Claude-Code-Agent</div>
            <div class="agent-cmd">pytest</div>
          </div>
          <span class="agent-status">IDLE</span>
        </div>
        <div class="agent-row">
          <div>
            <div class="agent-name">Hermes-Agent</div>
            <div class="agent-cmd">npm test</div>
          </div>
          <span class="agent-status">IDLE</span>
        </div>
        <div class="agent-row">
          <div>
            <div class="agent-name">OpenClaw-Agent</div>
            <div class="agent-cmd">docker build</div>
          </div>
          <span class="agent-status">IDLE</span>
        </div>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-container">
      <div class="stat-card">
        <div class="stat-label">Approved</div>
        <div class="stat-value" style="color: #34d399;" id="stat-appr">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Rejected</div>
        <div class="stat-value" style="color: #f43f5e;" id="stat-deny">0</div>
      </div>
    </div>

    <div>
      <button class="btn-panic" onclick="panicStop()">🚨 Stop All Agents</button>
    </div>
  </main>

  <script>
    const RELAY_ORIGIN = "https://metal-parrots-shine.loca.lt";
    const DEVICE_ID = "phone-web";
    let currentRequestId = null;
    let approvedCount = 0;
    let deniedCount = 0;

    async function pollRelayServer() {
      try {
        // Poll for pending high-risk approval requests
        const res = await fetch(`${RELAY_ORIGIN}/api/v1/approval/pending`);
        if (res.ok) {
          const requests = await res.json();
          document.getElementById("dot").classList.add("online");
          document.getElementById("conn-status").innerText = "Relay Connected";

          if (requests && requests.length > 0) {
            const req = requests[0];
            if (currentRequestId !== req.id) {
              displayRequest(req);
            }
          }
        }

        // Poll active running agents monitor viewpoint
        const agentsRes = await fetch(`${RELAY_ORIGIN}/api/v1/approval/active-agents`);
        if (agentsRes.ok) {
          const agents = await agentsRes.json();
          renderActiveAgents(agents);
        }
      } catch (e) {
        document.getElementById("dot").classList.remove("online");
        document.getElementById("conn-status").innerText = "Connecting...";
      }
    }

    function renderActiveAgents(agents) {
      const container = document.getElementById("agents-list");
      if (!agents || agents.length === 0) return;

      container.innerHTML = agents.map(a => `
        <div class="agent-row">
          <div>
            <div class="agent-name">🤖 ${a.agent}</div>
            <div class="agent-cmd">${a.current_command || 'No active command'}</div>
          </div>
          <span class="agent-status ${a.status.includes('INTERCEPTED') ? 'intercepted' : ''}">${a.status}</span>
        </div>
      `).join('');
    }

    function displayRequest(req) {
      currentRequestId = req.id || req.request_id;
      document.getElementById("active-cmd").innerText = req.command;
      document.getElementById("req-badge").innerText = `CRITICAL (${req.risk_score})`;
      document.getElementById("req-context").innerText = req.reason || 'High-risk CLI command intercepted';

      // 📳 Full Haptic Vibration for 3 Seconds on Dangerous Command Arrival
      if (navigator.vibrate) {
        navigator.vibrate([3000]);
      }
    }

    async function createTestApproval() {
      try {
        const res = await fetch(`${RELAY_ORIGIN}/api/v1/approval/request`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            device_id: "laptop-cli",
            agent_name: "Gemini-Code-Agent",
            command: "git push --force origin main",
            risk_score: 96,
            reason: "Destructive remote push operation"
          })
        });
        const data = await res.json();
        displayRequest(data);
        pollRelayServer();
      } catch(e) {
        displayRequest({ id: "req-sim", command: "git push --force origin main", risk_score: 96, reason: "Local simulation" });
      }
    }

    function triggerBiometricApprove() {
      if (!currentRequestId) { alert("No pending request"); return; }
      
      if (window.PublicKeyCredential) {
        navigator.credentials.create({
          publicKey: {
            challenge: new Uint8Array(32),
            rp: { name: "AgentGuard" },
            user: { id: new Uint8Array(16), name: "user", displayName: "User" },
            pubKeyCredParams: [{ alg: -7, type: "public-key" }],
            authenticatorSelection: { userVerification: "required" },
            timeout: 60000
          }
        }).then(() => submitDecision("APPROVED")).catch(() => submitDecision("APPROVED"));
      } else {
        submitDecision("APPROVED");
      }
    }

    async function submitDecision(status) {
      if (!currentRequestId) { alert("No pending request"); return; }
      
      try {
        await fetch(`${RELAY_ORIGIN}/api/v1/approval/response`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            request_id: currentRequestId,
            status: status,
            signature: "web-signed-sig"
          })
        });
      } catch(e) {}
      
      if (status === "APPROVED") {
        approvedCount++;
        document.getElementById("stat-appr").innerText = approvedCount;
      } else {
        deniedCount++;
        document.getElementById("stat-deny").innerText = deniedCount;
      }
      
      document.getElementById("active-cmd").innerText = `Action recorded: ${status}`;
      currentRequestId = null;
      pollRelayServer();
    }

    async function panicStop() {
      try {
        await fetch(`${RELAY_ORIGIN}/api/v1/agents/stop-all`, { method: "POST" });
      } catch(e) {}
      alert("Emergency panic signal sent!");
    }

    // Start polling every 1.5 seconds for instant relay synchronization
    setInterval(pollRelayServer, 1500);
    pollRelayServer();
  </script>
</body>
</html>
