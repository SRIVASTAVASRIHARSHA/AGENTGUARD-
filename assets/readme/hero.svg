<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%" style="background: #090d16; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101d"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>
    
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    
    <linearGradient id="badge-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff416c"/>
      <stop offset="100%" stop-color="#ff4b2b"/>
    </linearGradient>
    
    <linearGradient id="badge-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11998e"/>
      <stop offset="100%" stop-color="#38ef7d"/>
    </linearGradient>

    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="1200" height="480" fill="url(#bg-grad)" rx="16"/>

  <!-- Decorative subtle Grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="480"/>
    <line x1="400" y1="0" x2="400" y2="480"/>
    <line x1="600" y1="0" x2="600" y2="480"/>
    <line x1="800" y1="0" x2="800" y2="480"/>
    <line x1="1000" y1="0" x2="1000" y2="480"/>
  </g>

  <!-- Glow highlights -->
  <circle cx="200" cy="180" r="180" fill="#00f2fe" opacity="0.06" filter="url(#glow-cyan)"/>
  <circle cx="1000" cy="300" r="220" fill="#ff416c" opacity="0.05" filter="url(#glow-cyan)"/>

  <!-- Left Content Column -->
  <g transform="translate(70, 0)">
    <!-- Security Shield Pill -->
    <rect x="0" y="85" width="195" height="32" rx="16" fill="#152035" stroke="#00f2fe" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="20" cy="101" r="5" fill="#00f2fe"/>
    <text x="34" y="106" fill="#00f2fe" font-size="13" font-weight="600" letter-spacing="1">ZERO-TRUST AUDIT</text>

    <!-- Main Title -->
    <text x="0" y="175" fill="#ffffff" font-size="52" font-weight="800" letter-spacing="-1">Agent<tspan fill="url(#accent-cyan)">Guard</tspan></text>

    <!-- Subtitle / Value Prop -->
    <text x="0" y="225" fill="#94a3b8" font-size="20" font-weight="400">Human-in-the-Loop Security Gateway</text>
    <text x="0" y="255" fill="#94a3b8" font-size="20" font-weight="400">for AI Agents &amp; Autonomous Workflows.</text>

    <!-- Key Bullet Points -->
    <g transform="translate(0, 295)">
      <!-- Item 1 -->
      <path d="M 0 10 L 8 18 L 22 2" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round"/>
      <text x="32" y="14" fill="#e2e8f0" font-size="16" font-weight="500">Real-Time Command Risk Scoring Engine</text>

      <!-- Item 2 -->
      <path d="M 0 45 L 8 53 L 22 37" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round"/>
      <text x="32" y="49" fill="#e2e8f0" font-size="16" font-weight="500">Ed25519 Biometric Phone Approval Prompt</text>

      <!-- Item 3 -->
      <path d="M 0 80 L 8 88 L 22 72" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round"/>
      <text x="32" y="84" fill="#e2e8f0" font-size="16" font-weight="500">Tamper-Proof SHA-256 Audit Hash Chain</text>
    </g>
  </g>

  <!-- Right Visual Mockup: Simulated Mobile Security Prompt & Terminal Card -->
  <g transform="translate(680, 60)">
    <!-- Terminal Box Card -->
    <rect x="0" y="0" width="450" height="230" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <!-- Terminal Header -->
    <path d="M 0 0 L 450 0 L 450 36 L 0 36 Z" fill="#1e293b" rx="12"/>
    <circle cx="20" cy="18" r="5" fill="#ef4444"/>
    <circle cx="36" cy="18" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="18" r="5" fill="#10b981"/>
    <text x="75" y="22" fill="#64748b" font-size="12" font-family="monospace">agentguard-interceptor --watch</text>

    <!-- Terminal Code lines -->
    <g transform="translate(20, 60)" font-family="monospace" font-size="13">
      <text x="0" y="0" fill="#00f2fe">$ agent-run "git push --force origin main"</text>
      <text x="0" y="25" fill="#f59e0b">[RISK ENGINE] Calculating score...</text>
      <text x="0" y="50" fill="#ef4444">[ALERT] High Risk Score: 96/100 (CRITICAL)</text>
      <text x="0" y="75" fill="#94a3b8">[RELAY] Sent push notification to paired phone.</text>
      <text x="0" y="100" fill="#38ef7d">[RELAY] Long-polling response... (awaiting signature)</text>
      <circle cx="375" cy="96" r="4" fill="#38ef7d">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Floating Phone Approval Prompt Overlay Card -->
    <g transform="translate(140, 160)">
      <rect x="0" y="0" width="290" height="180" rx="14" fill="#1e293b" stroke="#00f2fe" stroke-width="2" filter="url(#glow-cyan)"/>
      
      <!-- Prompt Header -->
      <rect x="15" y="15" width="75" height="22" rx="11" fill="url(#badge-red)"/>
      <text x="52" y="30" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">CRITICAL</text>
      
      <text x="100" y="31" fill="#ffffff" font-size="13" font-weight="600">Approval Request</text>

      <text x="15" y="60" fill="#94a3b8" font-size="12" font-weight="400">Command:</text>
      <rect x="15" y="70" width="260" height="28" rx="6" fill="#0f172a"/>
      <text x="25" y="88" fill="#ff4b2b" font-size="11" font-family="monospace">git push --force origin main</text>

      <!-- Action Buttons -->
      <rect x="15" y="120" width="120" height="38" rx="8" fill="#334155"/>
      <text x="75" y="144" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="middle">DENY</text>

      <rect x="145" y="120" width="130" height="38" rx="8" fill="url(#badge-green)"/>
      <text x="210" y="144" fill="#052e16" font-size="13" font-weight="700" text-anchor="middle">APPROVE 🔑</text>
    </g>
  </g>
</svg>
