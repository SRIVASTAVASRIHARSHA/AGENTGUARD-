<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%" style="background: #090d16; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#38ef7d"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="#090d16" rx="16"/>

  <text x="600" y="45" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle">AgentGuard System Architecture &amp; Execution Pipeline</text>
  <text x="600" y="70" fill="#64748b" font-size="14" text-anchor="middle">Zero-Trust Interception, Real-Time Risk Analysis &amp; Ed25519 Mobile Verification</text>

  <!-- Flow Line -->
  <path d="M 220 180 L 980 180" fill="none" stroke="url(#line-grad)" stroke-width="3" stroke-dasharray="8,6"/>

  <!-- Node 1: AI Agent / CLI -->
  <g transform="translate(100, 110)">
    <rect width="220" height="140" rx="12" fill="#0f172a" stroke="#00f2fe" stroke-width="1.5"/>
    <rect x="15" y="15" width="36" height="36" rx="8" fill="#1e293b"/>
    <text x="33" y="38" fill="#00f2fe" font-size="18" text-anchor="middle">🤖</text>
    <text x="62" y="32" fill="#ffffff" font-size="15" font-weight="700">1. CLI Interceptor</text>
    <text x="62" y="48" fill="#64748b" font-size="12">Laptop / AI Agent SDK</text>
    
    <text x="15" y="80" fill="#94a3b8" font-size="12">• Intercepts dangerous bash commands</text>
    <text x="15" y="100" fill="#94a3b8" font-size="12">• Evaluates 20+ regex patterns</text>
    <text x="15" y="120" fill="#00f2fe" font-size="12" font-weight="600">Score 0-100 (Risk Tier)</text>
  </g>

  <!-- Node 2: Cloud Relay -->
  <g transform="translate(490, 110)">
    <rect width="220" height="140" rx="12" fill="#0f172a" stroke="#4facfe" stroke-width="1.5"/>
    <rect x="15" y="15" width="36" height="36" rx="8" fill="#1e293b"/>
    <text x="33" y="38" fill="#4facfe" font-size="18" text-anchor="middle">⚡</text>
    <text x="62" y="32" fill="#ffffff" font-size="15" font-weight="700">2. Cloud Relay</text>
    <text x="62" y="48" fill="#64748b" font-size="12">Node.js Express / WS</text>

    <text x="15" y="80" fill="#94a3b8" font-size="12">• Manages WebSocket push router</text>
    <text x="15" y="100" fill="#94a3b8" font-size="12">• Handles 30s long-polling queue</text>
    <text x="15" y="120" fill="#4facfe" font-size="12" font-weight="600">SHA-256 Hash Chained Audit</text>
  </g>

  <!-- Node 3: Android App -->
  <g transform="translate(880, 110)">
    <rect width="220" height="140" rx="12" fill="#0f172a" stroke="#38ef7d" stroke-width="1.5"/>
    <rect x="15" y="15" width="36" height="36" rx="8" fill="#1e293b"/>
    <text x="33" y="38" fill="#38ef7d" font-size="18" text-anchor="middle">📱</text>
    <text x="62" y="32" fill="#ffffff" font-size="15" font-weight="700">3. Mobile Guard</text>
    <text x="62" y="48" fill="#64748b" font-size="12">Android / Jetpack Compose</text>

    <text x="15" y="80" fill="#94a3b8" font-size="12">• High-priority push notification</text>
    <text x="15" y="100" fill="#94a3b8" font-size="12">• Android KeyStore Ed25519</text>
    <text x="15" y="120" fill="#38ef7d" font-size="12" font-weight="600">Biometric Unlock &amp; Sign</text>
  </g>

  <!-- Arrows -->
  <polygon points="465,180 450,173 450,187" fill="#4facfe"/>
  <polygon points="855,180 840,173 840,187" fill="#38ef7d"/>
</svg>
